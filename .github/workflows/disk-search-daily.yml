name: Búsqueda diaria de discos

on:
  schedule:
    # 06:00 UTC ≈ 07:00 en invierno y 08:00 en verano (hora de Madrid).
    - cron: "0 6 * * *"
  workflow_dispatch:
  # Temporal: permite probar el workflow en la rama antes del merge.
  # No despliega Pages porque los pasos de publicación solo corren en main.
  push:
    branches:
      - feat/github-actions-diario

concurrency:
  group: disk-search-daily
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PYTHONUNBUFFERED: "1"
  DISKSEARCH_DB: ${{ github.workspace }}/.cache/disk-search/history.sqlite3

jobs:
  search:
    name: Buscar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Restaurar histórico
        id: history
        uses: actions/cache/restore@v4
        with:
          path: .cache/disk-search
          key: disksearch-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            disksearch-history-

      - name: Buscar discos
        run: |
          mkdir -p .cache/disk-search public
          python nas_discos.py --once --debug
          cp nas_discos.html public/index.html

      - name: Comprobar resultados
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import sys

          html = pathlib.Path("nas_discos.html").read_text(encoding="utf-8")
          match = re.search(r"const DATA=(\{.*?\});\s*\nconst BOOT=", html, re.S)
          if not match:
              sys.exit("No se pudo leer el dataset del HTML generado")

          data = json.loads(match.group(1))
          unique = int(data.get("meta", {}).get("unique", 0))
          print(f"Discos distintos: {unique}")
          if unique == 0:
              sys.exit(
                  "La búsqueda no devolvió discos; no se publica para no vaciar la página"
              )
          PY

      - name: Guardar histórico
        if: always() && hashFiles('.cache/disk-search/history.sqlite3') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/disk-search
          key: disksearch-history-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Subir HTML como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nas-discos-${{ github.run_number }}
          path: public/index.html
          if-no-files-found: warn
          retention-days: 30

      - name: Configurar Pages
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Empaquetar sitio
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Desplegar en Pages
        id: deployment
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
